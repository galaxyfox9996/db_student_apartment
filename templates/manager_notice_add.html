<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布公告 - 学生公寓管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- 移动端顶部栏 -->
    <div class="top-bar">
        <h2>公寓管理员</h2>
        <a href="/logout" class="mobile-logout">退出登录</a>
    </div>

    <div class="page-wrapper">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>🏢 公寓管理系统</h1>
                <p class="brand-subtitle">公寓管理员</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">功能菜单</div>
                <ul class="nav-menu">
                    <li><a href="/manager"><span class="nav-icon">🏠</span>管理首页</a></li>
                    <li><a href="/manager/repair/list"><span class="nav-icon">🔧</span>维修申报处理</a></li>
                    <li><a href="/manager/visitor/list"><span class="nav-icon">📝</span>访客登记管理</a></li>
                    <li><a href="/manager/notice/list" class="active"><span class="nav-icon">📢</span>公告管理</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="logout-btn">
                    <span>🚪</span> 退出登录
                </a>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h2>发布新公告</h2>
                <a href="/manager/notice/list" class="btn-cancel" style="text-decoration: none; padding: 10px 24px;">← 返回列表</a>
            </div>

            <div class="form-card">
                <div class="form-card-header">
                    <h3>📢 公告信息</h3>
                </div>
                <div class="form-card-body">
                    <form method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="title">公告标题 <span style="color: red;">*</span></label>
                            <input type="text" id="title" name="title" required placeholder="请输入公告标题" maxlength="255">
                        </div>

                        <div class="form-group">
                            <label for="content">公告内容 <span style="color: red;">*</span></label>
                            <textarea id="content" name="content" required placeholder="请输入公告详细内容" rows="8" style="width: 100%; padding: 12px; border: 1px solid var(--border, #e0e0e0); border-radius: var(--radius-sm, 8px); font-size: 0.95rem; resize: vertical;"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="image">公告图片（选填）</label>
                            <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png,.gif,.webp">
                            <small style="color: #999; display: block; margin-top: 4px;">支持 jpg、jpeg、png、gif、webp 格式，大小不超过 5MB</small>
                        </div>

                        <div class="form-group">
                            <label for="file">公告附件（选填）</label>
                            <input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.xls,.xlsx">
                            <small style="color: #999; display: block; margin-top: 4px;">支持 pdf、doc、docx、xls、xlsx 格式，大小不超过 5MB</small>
                        </div>

                        <div class="form-group">
                            <label for="video">公告视频（选填）</label>
                            <input type="file" id="video" name="video" accept=".mp4,.avi,.mov">
                            <small style="color: #999; display: block; margin-top: 4px;">支持 mp4、avi、mov 格式，大小不超过 5MB</small>
                        </div>

                        <div class="form-actions" style="display: flex; gap: 12px; margin-top: 24px;">
                            <button type="submit" class="btn-submit">发布公告</button>
                            <a href="/manager/notice/list" class="btn-cancel" style="text-decoration: none; padding: 12px 24px;">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
