<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增公寓管理员 - 学生公寓管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- 移动端顶部栏 -->
    <div class="top-bar">
        <h2>系统管理员</h2>
        <a href="/logout" class="mobile-logout">退出登录</a>
    </div>

    <div class="page-wrapper">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>🏢 公寓管理系统</h1>
                <p class="brand-subtitle">系统管理员</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">功能菜单</div>
                <ul class="nav-menu">
                    <li><a href="/admin/students"><span class="nav-icon">👥</span>学生信息管理</a></li>
                    <li><a href="/admin/managers" class="active"><span class="nav-icon">👨‍💼</span>公寓管理员管理</a></li>
                    <li><a href="/admin/apartments"><span class="nav-icon">🏠</span>公寓信息管理</a></li>
                    <li><a href="/admin/rooms"><span class="nav-icon">🚪</span>房间信息管理</a></li>
                    <li><a href="#"><span class="nav-icon">📋</span>住宿分配管理</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="logout-btn">
                    <span>🚪</span> 退出登录
                </a>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h2>新增公寓管理员</h2>
                <p class="welcome-text">请填写以下信息来添加一名新的公寓管理员。</p>
            </div>

            <div class="form-card">
                <div class="form-card-header">
                    <h3>📝 公寓管理员基本信息</h3>
                </div>
                <div class="form-card-body">
                    <form method="post">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="employee_no">员工编号</label>
                                <input type="text" id="employee_no" name="employee_no" placeholder="请输入员工编号" required>
                            </div>
                            <div class="form-group">
                                <label for="name">姓名</label>
                                <input type="text" id="name" name="name" placeholder="请输入姓名" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="gender">性别</label>
                                <select id="gender" name="gender" required>
                                    <option value="">请选择性别</option>
                                    <option value="male">男</option>
                                    <option value="female">女</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="phone">联系电话</label>
                                <input type="text" id="phone" name="phone" placeholder="请输入联系电话">
                            </div>
                            <div class="form-group">
                                <label for="email">邮箱</label>
                                <input type="email" id="email" name="email" placeholder="请输入邮箱地址">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">保存</button>
                            <a href="/admin/managers" class="btn-cancel">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
